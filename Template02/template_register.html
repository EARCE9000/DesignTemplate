<!DOCTYPE html>
<!--
  Template02 / 個人向け(B2C) : 新規会員登録(中央パネル)
  トーン: 親しみ・ポップ(暖色・丸み)。login と対の画面。
  ※ UIテンプレート(ダミー項目)。実在サービスの偽装や実資格情報の収集には使わない。

  Copyright (c) 2026 EARCE.NET (code & design)
  License: MIT License - see LICENSE
  Source: https://github.com/EARCE9000/DesignTemplate (published on GitHub)
-->
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>新規登録 | {{サービス名}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./assets/base.css" type="text/css">
</head>
<body>

<div class="auth_wrap">
  <div class="auth_card">

    <div class="brand">
      <div class="brand_mark">🌷</div>
      <div class="brand_name">{{サービス名}}</div>
    </div>

    <h1 class="auth_title">はじめまして</h1>
    <p class="auth_sub">アカウントを作成してはじめましょう</p>

    <!-- <div class="alert alert_error">入力内容に誤りがあります。ご確認ください。</div> -->

    <!-- 実際は登録エンドポイントへPOSTし、成功後にホーム/ようこそ画面へ。demoは home へ遷移 -->
    <form method="post" action="template_home.html">

      <div class="field">
        <label class="field_label" for="name">お名前（ニックネーム可）</label>
        <input class="input" type="text" id="name" name="name" placeholder="山田 はな" autocomplete="name" required>
      </div>

      <div class="field">
        <label class="field_label" for="email">メールアドレス</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field_label" for="password">パスワード</label>
        <div class="input_group">
          <input class="input" type="password" id="password" name="password" placeholder="8文字以上" autocomplete="new-password" minlength="8" required>
          <button type="button" class="input_toggle" data-toggle="password" aria-label="パスワードを表示">👁️</button>
        </div>
        <div class="field_hint">半角英数字と記号が使えます（8文字以上）</div>
      </div>

      <label class="check" style="margin:4px 0 20px;">
        <input type="checkbox" name="agree" value="1" required>
        <span><a href="{{規約URL}}">利用規約</a>・<a href="{{プライバシーURL}}">プライバシーポリシー</a>に同意します</span>
      </label>

      <button type="submit" class="btn btn_primary">登録する</button>
    </form>

    <div class="divider">または</div>

    <button type="button" class="btn btn_ghost btn_social">
      <span class="btn_icon">🟦</span> Googleで登録
    </button>
    <button type="button" class="btn btn_ghost btn_social">
      <span class="btn_icon">💬</span> LINEで登録
    </button>

    <div class="auth_foot">
      すでにアカウントをお持ちの方は <a href="template_login.html">ログイン</a>
    </div>

  </div>
</div>

<script>
  document.querySelectorAll('.input_toggle[data-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-toggle'));
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁️';
      btn.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
    });
  });
</script>
</body>
</html>
