<!DOCTYPE html>
<!--
  Template02 / 個人向け(B2C) : お知らせ(通知フィード/時系列型)
  見せ方: すべて/未読の切替 + 日付グループ + 行リスト(アイコン/本文/時刻)。
          未読は薄い青地＋未読ドットで区別。※ さがす(カード発見型)とは別の見せ方。

  Copyright (c) 2026 EARCE.NET (code & design)
  License: MIT License - see LICENSE
  Source: https://github.com/EARCE9000/DesignTemplate (published on GitHub)
-->
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>お知らせ | {{サービス名}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./assets/base.css" type="text/css">
</head>
<body>

<header class="app_header">
  <div class="app_header_inner">
    <div class="app_brand"><span class="brand_mark">🌷</span><span>お知らせ</span></div>
    <div class="app_actions">
      <button class="icon_btn" aria-label="すべて既読にする">✓</button>
    </div>
  </div>
</header>

<main class="app_main">

  <!-- 絞り(すべて/未読) -->
  <div class="seg">
    <a class="active" href="#">すべて</a>
    <a href="#">未読 <span class="badge badge_primary" style="margin-left:4px;">3</span></a>
  </div>

  <!-- 今日 -->
  <div class="feed_date">今日</div>
  <div class="list_card">
    <a class="list_row unread" href="#">
      <div class="lr_icon">🎁</div>
      <div class="lr_body">
        <div class="lr_title">300ポイントをプレゼント！</div>
        <div class="lr_sub">秋のキャンペーン参加でポイント進呈中です</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <span class="unread_dot"></span>
        <span class="lr_meta">9:24</span>
      </div>
    </a>
    <a class="list_row unread" href="#">
      <div class="lr_icon">📅</div>
      <div class="lr_body">
        <div class="lr_title">ご予約リマインド</div>
        <div class="lr_sub">明日 14:00「カット＆カラー」のご予約です</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <span class="unread_dot"></span>
        <span class="lr_meta">8:00</span>
      </div>
    </a>
  </div>

  <!-- 今週 -->
  <div class="feed_date">今週</div>
  <div class="list_card">
    <a class="list_row unread" href="#">
      <div class="lr_icon">🎟️</div>
      <div class="lr_body">
        <div class="lr_title">クーポンが届きました</div>
        <div class="lr_sub">次回使える10%OFFクーポン（〜9/30）</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <span class="unread_dot"></span>
        <span class="lr_meta">9/1</span>
      </div>
    </a>
    <a class="list_row" href="#">
      <div class="lr_icon">✅</div>
      <div class="lr_body">
        <div class="lr_title">ご予約が確定しました</div>
        <div class="lr_sub">「アロマ全身リラク 90分」9/6 15:00</div>
      </div>
      <span class="lr_meta">8/31</span>
    </a>
  </div>

  <!-- 以前 -->
  <div class="feed_date">以前</div>
  <div class="list_card">
    <a class="list_row" href="#">
      <div class="lr_icon">📢</div>
      <div class="lr_body">
        <div class="lr_title">メンテナンスのお知らせ</div>
        <div class="lr_sub">8/28 深夜にシステムメンテナンスを実施しました</div>
      </div>
      <span class="lr_meta">8/27</span>
    </a>
    <a class="list_row" href="#">
      <div class="lr_icon">👋</div>
      <div class="lr_body">
        <div class="lr_title">ようこそ！はじめてガイド</div>
        <div class="lr_sub">使い方のヒントをまとめました</div>
      </div>
      <span class="lr_meta">8/20</span>
    </a>
  </div>

</main>

<nav class="app_nav">
  <div class="app_nav_inner">
    <a class="nav_item" href="template_home.html"><span class="ni_icon">🏠</span>ホーム</a>
    <a class="nav_item" href="template_search.html"><span class="ni_icon">🔍</span>さがす</a>
    <a class="nav_item active" href="template_notifications.html"><span class="ni_icon">🔔</span>お知らせ</a>
    <a class="nav_item" href="template_mypage.html"><span class="ni_icon">👤</span>マイページ</a>
  </div>
</nav>

</body>
</html>
