<!DOCTYPE html>
<!--
  Template02 / 個人向け(B2C) : ログイン後ホーム(メニュー)
  アプリ風シェル: 上部ヘッダ + ハイライトカード + クイックメニュー + 最近の項目 + 下部タブナビ。
  トーン: 親しみ・ポップ(暖色・丸み)。モバイルファースト。

  Copyright (c) 2026 EARCE.NET (code & design)
  License: MIT License - see LICENSE
  Source: https://github.com/EARCE9000/DesignTemplate (published on GitHub)
-->
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>ホーム | {{サービス名}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./assets/base.css" type="text/css">
</head>
<body>

<!-- 上部ヘッダ -->
<header class="app_header">
  <div class="app_header_inner">
    <div class="app_brand">
      <span class="brand_mark">🌷</span>
      <span>{{サービス名}}</span>
    </div>
    <div class="app_actions">
      <button class="icon_btn" aria-label="お知らせ">🔔<span class="dot"></span></button>
      <a class="avatar" href="template_mypage.html" aria-label="マイページ">は</a>
    </div>
  </div>
</header>

<!-- 本文 -->
<main class="app_main">

  <div class="greeting">こんにちは、はなさん <span class="wave">👋</span></div>
  <p class="greeting_sub">今日もすてきな一日になりますように</p>

  <!-- ハイライトカード(ポイント/ステータス等) -->
  <div class="hero_card">
    <div class="hero_row">
      <div>
        <div class="hero_label">保有ポイント</div>
        <div class="hero_value">1,250 <span style="font-size:14px;font-weight:700;">pt</span></div>
      </div>
      <button class="hero_btn">ポイントを使う →</button>
    </div>
  </div>

  <!-- クイックメニュー -->
  <div class="section_title">メニュー</div>
  <div class="menu_grid">
    <a class="menu_tile" href="#">
      <div class="mt_icon">📅</div>
      <div class="mt_label">予約する</div>
    </a>
    <a class="menu_tile" href="#">
      <div class="mt_icon">🧾</div>
      <div class="mt_label">利用履歴</div>
    </a>
    <a class="menu_tile" href="#">
      <div class="mt_icon">🎟️</div>
      <div class="mt_label">クーポン</div>
    </a>
    <a class="menu_tile" href="#">
      <div class="mt_icon">💳</div>
      <div class="mt_label">お支払い</div>
    </a>
    <a class="menu_tile" href="#">
      <div class="mt_icon">🎁</div>
      <div class="mt_label">特典</div>
    </a>
    <a class="menu_tile" href="#">
      <div class="mt_icon">📖</div>
      <div class="mt_label">ガイド</div>
    </a>
    <a class="menu_tile" href="#">
      <div class="mt_icon">💬</div>
      <div class="mt_label">サポート</div>
    </a>
    <a class="menu_tile" href="template_mypage.html">
      <div class="mt_icon">⚙️</div>
      <div class="mt_label">設定</div>
    </a>
  </div>

  <!-- 最近の項目 -->
  <div class="section_title">最近の予約 <a class="see_all link_sm" href="#">すべて見る</a></div>
  <div class="list_card">
    <a class="list_row" href="#">
      <div class="lr_icon">💇</div>
      <div class="lr_body">
        <div class="lr_title">カット＆カラー</div>
        <div class="lr_sub">サロン青山 表参道店</div>
      </div>
      <div style="text-align:right;">
        <span class="badge badge_primary">予約中</span>
        <div class="lr_meta" style="margin-top:4px;">9/10 14:00</div>
      </div>
    </a>
    <a class="list_row" href="#">
      <div class="lr_icon">☕</div>
      <div class="lr_body">
        <div class="lr_title">ドリンクチケット</div>
        <div class="lr_sub">カフェ・ソレイユ</div>
      </div>
      <div style="text-align:right;">
        <span class="badge badge_ok">利用可</span>
        <div class="lr_meta" style="margin-top:4px;">〜9/30</div>
      </div>
    </a>
    <a class="list_row" href="#">
      <div class="lr_icon">🛍️</div>
      <div class="lr_body">
        <div class="lr_title">オンライン購入</div>
        <div class="lr_sub">エコバッグ ほか2点</div>
      </div>
      <div style="text-align:right;">
        <span class="badge badge_accent">発送準備</span>
        <div class="lr_meta" style="margin-top:4px;">8/30</div>
      </div>
    </a>
  </div>

</main>

<!-- 下部タブナビ -->
<nav class="app_nav">
  <div class="app_nav_inner">
    <a class="nav_item active" href="template_home.html"><span class="ni_icon">🏠</span>ホーム</a>
    <a class="nav_item" href="template_search.html"><span class="ni_icon">🔍</span>さがす</a>
    <a class="nav_item" href="template_notifications.html"><span class="ni_icon">🔔</span>お知らせ</a>
    <a class="nav_item" href="template_mypage.html"><span class="ni_icon">👤</span>マイページ</a>
  </div>
</nav>

</body>
</html>
