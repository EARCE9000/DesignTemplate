<!DOCTYPE html>
<!--
  テンプレート: 詳細表示(読み取り専用) 画面
  用途: 一覧の行から開く「1件の全項目表示」。編集・削除への入口を持つ。
        値は form_static で表示(入力欄は出さない)。
  含む: 削除確認モーダル(JS不要・チェックボックス方式)。
  フロー: 一覧 → 詳細 → [編集]template_form.html / [削除]モーダル→削除実行

  Copyright (c) 2026 EARCE.NET (code & design)
  License: MIT License - see LICENSE
  Source: https://github.com/EARCE9000/DesignTemplate (published on GitHub)
-->
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>詳細 | ToolKit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="./assets/flexbox.css" type="text/css">
<link rel="stylesheet" href="./assets/design.css" type="text/css">
<link rel="stylesheet" href="./assets/components.css" type="text/css">
</head>
<body>

<div class="header">
  <div class="header_title">{{システム名}}</div>
  <!-- たまにしか使わない機能は右上にアイコンで並べる(title がツールチップになる) -->
  <!-- アイコン出典: Feather Icons (MIT) settings / log-out、Lucide (ISC) history — THIRD_PARTY_NOTICES.md 参照 -->
  <div class="header_actions">
    <span class="header_user">{{ユーザー名}}</span>
    <a href="#" class="header_icon_button" title="管理" aria-label="管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <a href="#" class="header_icon_button" title="操作履歴" aria-label="操作履歴">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
    </a>
    <a href="#" class="header_icon_button" title="ログアウト" aria-label="ログアウト">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>
</div>

<div class="flex_menubar">
  <a href="template_menu.html">ホーム</a>
  <a href="template_list.html">一覧サンプル</a>
  <a href="template_detail.html">詳細</a>
</div>

<div class="flex_container">
  <div class="flex_main">

    <!-- 削除確認モーダルのトグル(本体は下部) -->
    <input type="checkbox" id="del_modal" class="modal_toggle" hidden>

    <div class="item_group" style="min-width:0;">
      <div class="item_title">
        <div class="title">サンプル名称</div>
        <span class="status_badge completed" style="margin-left:12px;">有効</span>
        <span style="margin-left:auto;display:inline-flex;gap:8px;">
          <a href="template_form.html" class="entry_button" style="line-height:28px;height:auto;width:auto;padding:2px 16px;text-decoration:none;font-size:10pt;">編集</a>
          <label for="del_modal" class="caution_button" style="line-height:28px;height:auto;width:auto;padding:2px 16px;font-size:10pt;cursor:pointer;border-radius:10px;">削除</label>
        </span>
      </div>

      <!-- ===== 基本情報 ===== -->
      <div class="form_section_title">基本情報</div>
      <div class="form_row">
        <div class="form_field">
          <div class="form_label">コード</div>
          <div class="form_value"><div class="form_static">A-001</div></div>
        </div>
        <div class="form_field">
          <div class="form_label">名称</div>
          <div class="form_value"><div class="form_static">サンプル名称</div></div>
        </div>
      </div>
      <div class="form_row">
        <div class="form_field">
          <div class="form_label">区分</div>
          <div class="form_value"><div class="form_static">区分A</div></div>
        </div>
        <div class="form_field">
          <div class="form_label">状態</div>
          <div class="form_value"><div class="form_static">有効</div></div>
        </div>
      </div>

      <!-- ===== 詳細 ===== -->
      <div class="form_section_title">詳細</div>
      <div class="form_row">
        <div class="form_field">
          <div class="form_label">表示順</div>
          <div class="form_value"><div class="form_static">10</div></div>
        </div>
        <div class="form_field">
          <div class="form_label">適用開始日</div>
          <div class="form_value"><div class="form_static">2026-08-13</div></div>
        </div>
      </div>
      <div class="form_row">
        <div class="form_field">
          <div class="form_label">メール通知</div>
          <div class="form_value"><div class="form_static">受け取る</div></div>
        </div>
        <div class="form_field">
          <div class="form_label">公開設定</div>
          <div class="form_value"><div class="form_static">非公開</div></div>
        </div>
      </div>
      <div class="form_row">
        <div class="form_field">
          <div class="form_label">説明</div>
          <div class="form_value"><div class="form_static">サンプルの説明文です。</div></div>
        </div>
      </div>

      <!-- ===== 更新履歴などのメタ(任意) ===== -->
      <div class="form_section_title">履歴</div>
      <div class="form_row">
        <div class="form_field">
          <div class="form_label">登録</div>
          <div class="form_value"><div class="form_static">2026-08-13 10:20  by yama</div></div>
        </div>
        <div class="form_field">
          <div class="form_label">最終更新</div>
          <div class="form_value"><div class="form_static">2026-08-14 09:05  by yama</div></div>
        </div>
      </div>

      <!-- 下部ボタン -->
      <div style="padding:10px;">
        <div class="flex_container">
          <div class="flex_item1 item_action">
            <a href="template_list.html" class="cancel_button" style="display:inline-block;line-height:36px;text-decoration:none;width:90%;text-align:center;border-radius:10px;">一覧へ戻る</a>
          </div>
          <div class="flex_item1 item_action">
            <a href="template_form.html" class="entry_button" style="display:inline-block;line-height:36px;text-decoration:none;width:90%;text-align:center;border-radius:10px;">編集</a>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 削除確認モーダル ===== -->
    <div class="modal_overlay">
      <label for="del_modal" class="modal_backdrop"></label>
      <div class="modal_box">
        <div class="modal_title danger">削除の確認</div>
        <div class="modal_body">
          「<strong>サンプル名称</strong>（A-001）」を削除します。<br>
          この操作は取り消せません。よろしいですか？
        </div>
        <div class="modal_actions">
          <label for="del_modal" class="cancel_button" style="line-height:34px;padding:0 18px;cursor:pointer;border-radius:10px;">キャンセル</label>
          <!-- 実際の削除エンドポイントに置き換える。demoは一覧へ遷移 -->
          <form method="post" action="template_list.html">
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="id" value="1">
            <button type="submit" class="caution_button">削除する</button>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="footer">
  <span class="footer_copyright">&copy; {{年}} {{会社名}}</span>
  <span class="footer_version">Ver. {{バージョン}}</span>
</div>

</body>
</html>
