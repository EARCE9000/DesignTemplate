<!DOCTYPE html>
<!--
  テンプレート: 状態画面(完了 / エラー)
  用途: 処理完了や、権限なし/未検出/サーバエラー等の結果を大きく伝える画面。
  使い方: .result_state に ok / error を付け、アイコン・タイトル・説明・
          次アクションを差し替える。下部コメントに 403/404/500 の例。
  ※ 一覧の「空状態(0件)」は template_list.html 内の .empty_state を参照。

  Copyright (c) 2026 EARCE.NET (code & design)
  License: MIT License - see LICENSE
  Source: https://github.com/EARCE9000/DesignTemplate (published on GitHub)
-->
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>登録完了 | ToolKit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="./assets/flexbox.css" type="text/css">
<link rel="stylesheet" href="./assets/design.css" type="text/css">
<link rel="stylesheet" href="./assets/components.css" type="text/css">
</head>
<body>

<div class="header">
  <div class="header_title">{{システム名}}</div>
  <!-- たまにしか使わない機能は右上にアイコンで並べる(title がツールチップになる) -->
  <!-- アイコン出典: Feather Icons (MIT) settings / log-out、Lucide (ISC) history — THIRD_PARTY_NOTICES.md 参照 -->
  <div class="header_actions">
    <span class="header_user">{{ユーザー名}}</span>
    <a href="#" class="header_icon_button" title="管理" aria-label="管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <a href="#" class="header_icon_button" title="操作履歴" aria-label="操作履歴">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
    </a>
    <a href="#" class="header_icon_button" title="ログアウト" aria-label="ログアウト">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>
</div>

<div class="flex_menubar">
  <a href="template_menu.html">ホーム</a>
  <a href="template_list.html">一覧サンプル</a>
</div>

<div class="flex_container">
  <div class="flex_main">

    <div class="item_group" style="min-width:0;">

      <!-- ===== 完了 ===== -->
      <div class="result_state ok">
        <div class="result_icon">✅</div>
        <div class="result_title">登録が完了しました</div>
        <div class="result_desc">
          「サンプル名称（A-001）」を登録しました。<br>
          続けて操作する場合は下のボタンから移動してください。
        </div>
        <div class="result_actions">
          <a href="template_list.html" class="entry_button" style="display:inline-block;line-height:36px;text-decoration:none;padding:0 22px;border-radius:10px;">一覧へ戻る</a>
          <a href="template_form.html" class="cancel_button" style="display:inline-block;line-height:36px;text-decoration:none;padding:0 22px;border-radius:10px;">続けて登録</a>
        </div>
      </div>

      <!-- ===== エラー例(必要に応じて上の完了と差し替え) =====
      <div class="result_state error">
        <div class="result_icon">🚫</div>
        <div class="result_title">アクセス権限がありません (403)</div>
        <div class="result_desc">この操作を行う権限がありません。管理者にお問い合わせください。</div>
        <div class="result_actions">
          <a href="template_menu.html" class="entry_button" style="display:inline-block;line-height:36px;text-decoration:none;padding:0 22px;border-radius:10px;">メニューへ</a>
        </div>
      </div>

      <div class="result_state error">
        <div class="result_icon">🔍</div>
        <div class="result_title">ページが見つかりません (404)</div>
        <div class="result_desc">お探しのデータは削除されたか、URLが誤っている可能性があります。</div>
        <div class="result_actions">
          <a href="template_menu.html" class="entry_button" style="display:inline-block;line-height:36px;text-decoration:none;padding:0 22px;border-radius:10px;">メニューへ</a>
        </div>
      </div>

      <div class="result_state error">
        <div class="result_icon">⚠️</div>
        <div class="result_title">エラーが発生しました (500)</div>
        <div class="result_desc">処理中に問題が発生しました。時間をおいて再度お試しください。</div>
        <div class="result_actions">
          <a href="template_menu.html" class="entry_button" style="display:inline-block;line-height:36px;text-decoration:none;padding:0 22px;border-radius:10px;">メニューへ</a>
        </div>
      </div>
      ===== -->

    </div>

  </div>
</div>

<div class="footer">
  <span class="footer_copyright">&copy; {{年}} {{会社名}}</span>
  <span class="footer_version">Ver. {{バージョン}}</span>
</div>

</body>
</html>
