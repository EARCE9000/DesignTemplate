<!DOCTYPE html>
<!--
  テンプレート: 単票 情報登録／編集 画面 (標準フォーム)
  用途: 1レコードをじっくり登録・編集する画面(マスタ登録・詳細編集など)。
        template_form_simple.html との違い:
          - template_form_simple.html … Queueレベルの簡易登録(少項目)。上で入力・下で直近一覧。
          - template_form.html (本ファイル) … 単票。項目が多くセクション分け・2カラム・各種入力型を持つ。
                                              一覧は同画面に持たず、保存後は一覧画面へ戻る運用。
  ポイント:
    - form_row に form_field を2つ並べると2カラム(狭幅で自動的に1カラム)。
    - 全幅にしたい項目(テキストエリア等)は form_field を1つだけ置く。
    - セクション見出しは .form_section_title。

  Copyright (c) 2026 EARCE.NET (code & design)
  License: MIT License - see LICENSE
  Source: https://github.com/EARCE9000/DesignTemplate (published on GitHub)
-->
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>単票登録サンプル | ToolKit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="./assets/flexbox.css" type="text/css">
<link rel="stylesheet" href="./assets/design.css" type="text/css">
<link rel="stylesheet" href="./assets/components.css" type="text/css">
</head>
<body>

<div class="header">
  <div class="header_title">{{システム名}}</div>
  <!-- 開発モードのしるし。authDisabled が true のときだけ出す(assets/dev_mode.js)。題字の要素の外に置く -->
  <span class="dev_mode_badge" hidden title="認証を切って動いている(AUTH_DISABLED)。誰でも管理者として入れる。本番では設定しない"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>開発モード</span>
  <!-- たまにしか使わない機能は右上にアイコンで並べる(title がツールチップになる) -->
  <!-- 並べる順: APIキー → 通知 → 管理 → 操作履歴 → ログアウト(ログアウトは常に右端)。無い機能は詰め、権限のない利用者にはボタンごと出さない -->
  <!-- アイコン出典: Feather Icons (MIT) key / bell / settings / log-out、Lucide (ISC) history — THIRD_PARTY_NOTICES.md 参照 -->
  <div class="header_actions">
    <span class="header_user">{{ユーザー名}}</span>
    <a href="#" class="header_icon_button" title="APIキー管理" aria-label="APIキー管理" data-open="apikeys">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
    </a>
    <a href="#" class="header_icon_button" title="通知" aria-label="通知" data-toggle="notify" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </a>
    <a href="template_admin.html" class="header_icon_button" title="管理" aria-label="管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <a href="#" class="header_icon_button" title="操作履歴" aria-label="操作履歴" data-open="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
    </a>
    <a href="#" class="header_icon_button" title="ログアウト" aria-label="ログアウト">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>
</div>

<div class="flex_menubar">
  <a href="template_menu.html"><svg class="inline_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>ホーム</a>
  <a href="template_list.html">一覧サンプル</a>
  <a href="template_form.html">新規登録</a>
</div>

<div class="flex_container">
  <div class="flex_main">

    <!-- 処理結果メッセージ(必要時のみ) -->
    <!-- <div class="msg_success">保存しました。</div> -->
    <!-- <div class="msg_error">エラー: {{項目}}を確認してください。</div> -->

    <div class="item_group" style="min-width:0;">
      <div class="item_title">
        <div class="title">{{対象名}} 登録</div>
        <!-- 編集モードでは登録日時やIDのバッジを添える例 -->
        <!-- <span class="db_badge" style="margin-left:auto;">ID: 1024</span> -->
      </div>

      <!-- 入力→確認画面へ(確認画面で最終的に登録する)。
           編集は action=update + hidden id。確認を挟まない場合は直接
           登録エンドポイントを action にしてよい。 -->
      <form method="post" action="template_form_confirm.html">
        <input type="hidden" name="action" value="confirm">
        <!-- 編集時: <input type="hidden" name="id" value="{{id}}"> -->

        <!-- ===== セクション: 基本情報 ===== -->
        <div class="form_section_title">基本情報</div>

        <div class="form_row">
          <div class="form_field">
            <div class="form_label required">コード</div>
            <div class="form_value">
              <input type="text" name="code" value="" placeholder="例: A-001" maxlength="32" required>
            </div>
          </div>
          <div class="form_field">
            <div class="form_label required">名称</div>
            <div class="form_value">
              <input type="text" name="name" value="" placeholder="表示名" maxlength="128" required>
            </div>
          </div>
        </div>

        <div class="form_row">
          <div class="form_field">
            <div class="form_label">区分</div>
            <div class="form_value">
              <select name="category">
                <option value="">選択してください</option>
                <option value="1">区分A</option>
                <option value="2">区分B</option>
                <option value="3">区分C</option>
              </select>
            </div>
          </div>
          <div class="form_field">
            <div class="form_label">状態</div>
            <div class="form_value" style="padding-top:6px;">
              <label><input type="radio" name="state" value="active" checked> 有効</label>
              <label><input type="radio" name="state" value="inactive"> 無効</label>
            </div>
          </div>
        </div>

        <!-- ===== セクション: 詳細 ===== -->
        <div class="form_section_title">詳細</div>

        <div class="form_row">
          <div class="form_field">
            <div class="form_label">表示順</div>
            <div class="form_value">
              <input type="number" name="sort_order" value="0" min="0" step="1" style="width:8em;">
            </div>
          </div>
          <div class="form_field">
            <div class="form_label">適用開始日</div>
            <div class="form_value">
              <input type="date" name="start_date" value="">
            </div>
          </div>
        </div>

        <!-- 全幅項目(1行に1フィールドだけ置く) -->
        <div class="form_row">
          <div class="form_field">
            <div class="form_label">オプション</div>
            <div class="form_value" style="padding-top:6px;">
              <label><input type="checkbox" name="opt_notify" value="1"> 通知する</label>
              <label><input type="checkbox" name="opt_public" value="1"> 公開する</label>
            </div>
          </div>
        </div>

        <!-- トグルスイッチ(ON/OFF): 状態語が切り替わる例。確認画面と同じ2カラム配置 -->
        <div class="form_row">
          <div class="form_field">
            <div class="form_label">メール通知</div>
            <div class="form_value" style="padding-top:4px;">
              <label class="toggle_switch">
                <input type="checkbox" name="mail_notify" value="1" checked>
                <span class="toggle_track"></span>
                <span class="toggle_label">
                  <span class="toggle_on">受け取る</span>
                  <span class="toggle_off">受け取らない</span>
                </span>
              </label>
            </div>
          </div>
          <div class="form_field">
            <div class="form_label">公開設定</div>
            <div class="form_value" style="padding-top:4px;">
              <label class="toggle_switch">
                <input type="checkbox" name="is_public" value="1">
                <span class="toggle_track"></span>
                <span class="toggle_label">
                  <span class="toggle_on">公開</span>
                  <span class="toggle_off">非公開</span>
                </span>
              </label>
            </div>
          </div>
        </div>

        <div class="form_row">
          <div class="form_field">
            <div class="form_label">説明</div>
            <div class="form_value">
              <textarea name="description" placeholder="補足説明"></textarea>
            </div>
          </div>
        </div>

        <!-- 添付ファイル(ドラッグ&ドロップ / クリック選択、複数可) -->
        <div class="form_row">
          <div class="form_field">
            <div class="form_label">添付ファイル</div>
            <div class="form_value">
              <label class="dropzone">
                <input type="file" name="attachments[]" multiple hidden>
                <div class="dz_icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div>
                <div class="dz_text">ここにファイルをドラッグ＆ドロップ</div>
                <div class="dz_hint">または<span class="dz_browse">クリックして選択</span>（複数可）</div>
              </label>
              <div class="dz_file_list"></div>
            </div>
          </div>
        </div>

        <!-- ===== ボタン ===== -->
        <div style="padding:10px;">
          <div class="flex_container">
            <div class="flex_item1 item_action">
              <a href="template_list.html" class="cancel_button" style="display:inline-block;line-height:36px;text-decoration:none;width:90%;text-align:center;border-radius:10px;">一覧へ戻る</a>
            </div>
            <div class="flex_item1 item_action">
              <button type="submit" class="entry_button" style="width:90%">確認画面へ</button>
            </div>
          </div>
        </div>

      </form>
    </div>

  </div>
</div>

<div class="footer">
  <span class="footer_copyright">&copy; {{年}} {{会社名}}</span>
  <span class="footer_version">Ver. {{バージョン}}</span>
</div>

<!-- ファイルD&Dの共通挙動(全 .dropzone を自動初期化) -->
<script src="./assets/dropzone.js"></script>
<script src="./assets/ui.js"></script>
<script src="./assets/account.js" data-keys="./webapi/apikeys" data-history="./webapi/history" data-guide="./webapi/usage.md" data-demo></script>
<script src="./assets/dev_mode.js" data-check="./webapi/check_access_token" data-demo></script>
</body>
</html>
